<title>Tasting Mate</title>

<!-- &#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;
     LIVE FEED SETTINGS

     Normally you only need the project name. The app works out the
     database address itself the first time it loads, and remembers it.

     If you ever want to pin it down exactly (a fraction faster, and
     immune to a flaky first load), open the Connection check in the
     app, copy the address it found, and paste it into TASTING_MATE_DB.
     &#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552; -->
<script>
  window.TASTING_MATE_PROJECT = "tasting-mate";
  window.TASTING_MATE_DB = "";
</script>

<script>(function(){if(!document.querySelector('meta[name="viewport"]')){var m=document.createElement("meta");m.name="viewport";m.content="width=device-width, initial-scale=1, viewport-fit=cover";document.head.appendChild(m);}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Karla:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap">

<style>
:root{
  --night:#07201E; --night-2:#0D2E2B; --night-3:#123B37; --line:#1D4B47;
  --teal:#00A29D; --teal-lt:#4ED6D0; --teal-deep:#04605E;
  --cream:#FEFBEC; --dim:#8FB3AF; --dim-2:#5F8481;
  --larry:#F2E64B; --coral:#FF7500; --sally:#8DC63F;
  --f-disp:"Lilita One","Arial Black",system-ui,sans-serif;
  --f-body:"Karla","Helvetica Neue",Arial,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--night);color:var(--cream);
  font-family:var(--f-body);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;min-height:100dvh;
  background-image:radial-gradient(120% 80% at 50% -10%,#12403C 0%,#07201E 62%);
  background-attachment:fixed;
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--teal-lt);outline-offset:2px;border-radius:6px}
img{max-width:100%}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* &#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472; shared atoms &#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472; */
.kick{font-weight:800;text-transform:uppercase;letter-spacing:.18em;font-size:11px;color:var(--teal-lt);display:block}
.disp{font-family:var(--f-disp);line-height:.98;letter-spacing:.4px;text-wrap:balance;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--teal);color:#04211F;
  font-family:var(--f-disp);font-size:17px;letter-spacing:.5px;padding:14px 22px;border-radius:12px;transition:transform .12s,background .15s,opacity .15s}
.btn:hover{background:var(--teal-lt)}
.btn:active{transform:scale(.98)}
.btn.wide{width:100%}
.btn.ghost{background:transparent;color:var(--cream);border:2px solid var(--line)}
.btn.ghost:hover{background:var(--night-2);border-color:var(--teal)}
.btn.gold{background:var(--larry);color:#2A2705}
.btn.gold:hover{background:#FFF06B}
.btn[disabled]{opacity:.4;pointer-events:none}
.card{background:var(--night-2);border:1.5px solid var(--line);border-radius:var(--r);padding:16px 17px}
.pill{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  background:rgba(255,255,255,.08);border-radius:20px;padding:5px 11px;font-variant-numeric:tabular-nums}
.live{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--larry)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--larry);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.fade{animation:fade .4s cubic-bezier(.4,0,.2,1)}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pop{animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

.ill{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.ill .liq{fill:var(--teal);opacity:.28;stroke:none}
.ill .sld{fill:currentColor;stroke:none}

/* &#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472; role picker &#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472; */
.pick{min-height:100dvh;display:grid;place-items:center;padding:32px 22px}
.pick .in{width:100%;max-width:540px}
.pick img.logo{width:190px;display:block;margin:0 auto 30px}
.pick h1{font-size:clamp(34px,7vw,46px);text-align:center;margin-bottom:10px}
.pick .sub{text-align:center;color:var(--dim);margin:0 0 30px;font-size:16px}
.roles{display:grid;gap:12px}
.role{display:grid;grid-template-columns:52px 1fr 18px;gap:15px;align-items:center;text-align:left;
  background:var(--night-2);border:1.5px solid var(--line);border-radius:var(--r);padding:17px 18px;transition:border-color .15s,transform .12s}
.role:hover{border-color:var(--teal)}
.role:active{transform:scale(.99)}
.role .ic{width:52px;height:52px;border-radius:13px;background:var(--night-3);display:grid;place-items:center;color:var(--teal-lt)}
.role .ic svg{width:26px;height:26px}
.role b{font-family:var(--f-disp);font-size:19px;display:block;line-height:1.1}
.role span{font-size:13.5px;color:var(--dim);line-height:1.4;display:block;margin-top:3px}
.role .ch{color:var(--dim-2);font-size:17px}
.pick .note{margin-top:26px;font-size:13px;color:var(--dim-2);text-align:center;line-height:1.55}

/* &#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472; presenter screen &#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472; */
.scr{min-height:100dvh;display:flex;flex-direction:column}
.scr-top{flex:0 0 auto;display:flex;align-items:center;gap:18px;padding:16px clamp(18px,3vw,40px);border-bottom:1.5px solid var(--line)}
.scr-top img{height:34px;width:auto}
.scr-top .ttl{font-family:var(--f-disp);font-size:16px;letter-spacing:.4px;color:var(--dim)}
.scr-top .sp{flex:1}
.scr-body{flex:1 1 auto;display:grid;grid-template-columns:minmax(0,1fr);min-height:0}
.scr-body.rail{grid-template-columns:minmax(0,1fr) 300px}
.stage{padding:clamp(22px,3.5vw,52px);display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.stage>*{margin-block:auto;width:100%}
.side{border-left:1.5px solid var(--line);padding:20px;overflow-y:auto;background:rgba(0,0,0,.16)}
.scr-ctl{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:12px clamp(18px,3vw,40px);border-top:1.5px solid var(--line);background:rgba(0,0,0,.25);flex-wrap:wrap}
.scr-ctl .step{font-size:12px;color:var(--dim-2);letter-spacing:.1em;text-transform:uppercase;font-weight:800}
.scr-ctl .sp{flex:1}
.ctlbtn{background:var(--night-2);border:1.5px solid var(--line);border-radius:10px;padding:9px 15px;font-size:13.5px;font-weight:700;transition:border-color .15s,background .15s}
.ctlbtn:hover{border-color:var(--teal);background:var(--night-3)}
.ctlbtn.on{background:var(--teal);color:#04211F;border-color:var(--teal)}

.stage h1{font-size:clamp(34px,6.4vw,92px);margin:0 0 .18em}
.stage h2{font-size:clamp(28px,4.4vw,60px);margin:0 0 .2em}
.stage h1.md{font-size:clamp(28px,4.4vw,58px)}
.stage h1.sm{font-size:clamp(24px,3.2vw,42px)}
.stage h2.md{font-size:clamp(24px,3.4vw,44px)}
.stage h2.sm{font-size:clamp(21px,2.6vw,34px)}
.stage .lead{font-size:clamp(17px,1.9vw,26px);line-height:1.5;color:var(--dim);max-width:22ch;margin:0}
.stage .lead.wide{max-width:34ch}
.stage .kick{margin-bottom:14px;font-size:clamp(11px,1.1vw,15px)}

.two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(24px,4vw,64px);align-items:center}
.two .art{display:grid;place-items:center}
.two .art img{max-height:46vh;width:auto;filter:drop-shadow(0 24px 44px rgba(0,0,0,.5))}
@media (max-width:820px){ .two{grid-template-columns:1fr;gap:22px} .two .art img{max-height:26vh} }

.specs{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.specs .pill{font-size:clamp(11px,1.1vw,15px);padding:7px 14px}

/* live results */
.cloud{display:flex;flex-wrap:wrap;gap:clamp(8px,1vw,16px);align-items:center;justify-content:flex-start}
.cloud b{font-family:var(--f-disp);line-height:1;display:inline-block;transition:font-size .5s cubic-bezier(.34,1.3,.64,1),color .4s;letter-spacing:.5px}
.hist{display:flex;align-items:flex-end;gap:clamp(8px,1.4vw,22px);height:clamp(150px,30vh,320px);margin-top:8px}
.hist .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:8px}
.hist .bar{width:100%;background:var(--teal);border-radius:9px 9px 4px 4px;transition:height .6s cubic-bezier(.34,1.2,.64,1);min-height:4px;position:relative}
.hist .bar span{position:absolute;top:-26px;left:0;right:0;text-align:center;font-family:var(--f-disp);font-size:clamp(14px,1.6vw,22px);color:var(--cream)}
.hist .lab{font-size:clamp(11px,1.1vw,15px);color:var(--dim);font-weight:700;text-align:center;line-height:1.2}
.hist .glass{width:clamp(20px,2.4vw,34px)}
.avg{font-family:var(--f-disp);font-size:clamp(44px,7vw,96px);line-height:1;font-variant-numeric:tabular-nums}
.avg small{font-size:.42em;color:var(--dim)}

.optbars{display:grid;gap:11px;margin-top:8px}
.optbar{position:relative;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--night-2)}
.optbar i{position:absolute;inset:0 auto 0 0;background:var(--night-3);transition:width .6s cubic-bezier(.34,1.2,.64,1);border-right:2px solid var(--teal)}
.optbar.right i{background:rgba(141,198,63,.26);border-right-color:var(--sally)}
.optbar.wrong i{background:rgba(255,117,0,.14);border-right-color:var(--coral)}
.optbar .txt{position:relative;display:flex;align-items:center;gap:12px;padding:clamp(12px,1.6vw,20px) clamp(14px,1.8vw,22px);font-size:clamp(15px,1.8vw,24px);font-weight:700}
.optbar .n{margin-left:auto;font-family:var(--f-disp);font-variant-numeric:tabular-nums;color:var(--dim)}
.optbar.right .n{color:var(--sally)}
.optbar .mk{font-family:var(--f-disp);font-size:.9em}

/* lobby */
.lobby{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(24px,4vw,64px);align-items:center}
@media (max-width:900px){.lobby{grid-template-columns:1fr}}
.joinbox{background:var(--cream);color:#07201E;border-radius:20px;padding:22px;text-align:center;display:grid;gap:12px;justify-items:center}
.joinbox .qr{width:clamp(160px,20vw,240px);height:clamp(160px,20vw,240px);background:#fff;border-radius:10px;display:grid;place-items:center;overflow:hidden}
.joinbox .qr img,.joinbox .qr canvas{width:100%;height:100%;display:block}
.joinbox .lbl{font-family:var(--f-disp);font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#04605E}
.joinbox .url{font-size:12.5px;word-break:break-all;color:#3C4F4D;max-width:250px;line-height:1.4}
.bubbles{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px;max-height:36vh;overflow:hidden}
.bub{background:var(--night-2);border:1.5px solid var(--line);border-radius:22px;padding:8px 15px;font-weight:700;font-size:clamp(13px,1.4vw,18px);display:flex;align-items:center;gap:8px}
.bub i{width:8px;height:8px;border-radius:50%;background:var(--teal-lt);flex:0 0 auto}

/* side rail */
.side h4{font-family:var(--f-disp);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim-2);margin:0 0 12px}
.side .grp{margin-bottom:26px}
.who{display:flex;flex-wrap:wrap;gap:6px}
.who span{background:var(--night-2);border:1px solid var(--line);border-radius:16px;padding:4px 10px;font-size:12.5px;font-weight:700}
.mini{display:grid;gap:7px}
.mini .row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:13px}
.mini .tr{height:6px;background:var(--night-3);border-radius:4px;overflow:hidden;grid-column:1/-1}
.mini .tr i{display:block;height:100%;background:var(--teal);transition:width .5s}
.mini b{font-weight:700}
.mini .v{color:var(--teal-lt);font-variant-numeric:tabular-nums;font-weight:800}

/* cheers rain */
.rain{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.rain b{position:absolute;bottom:-40px;font-size:30px;animation:rise 2.6s ease-out forwards}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}12%{opacity:1}100%{transform:translateY(-88vh) rotate(22deg);opacity:0}}

/* &#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472; control desk (laptop) &#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472; */
.desk{min-height:100dvh;display:flex;flex-direction:column}
.desk-top{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:12px clamp(14px,2vw,24px);border-bottom:1.5px solid var(--line);flex-wrap:wrap}
.desk-top img{height:28px}
.desk-top .ttl{font-family:var(--f-disp);font-size:15px;color:var(--dim);letter-spacing:.4px}
.desk-top .sp{flex:1}
.desk-body{flex:1 1 auto;display:grid;grid-template-columns:210px minmax(0,1.2fr) minmax(290px,340px);min-height:0}
.desk-body.wide{grid-template-columns:210px minmax(0,1fr) 300px minmax(280px,340px)}
.desk-col{overflow-y:auto;min-height:0;padding:16px}
.desk-col + .desk-col{border-left:1.5px solid var(--line)}
.desk-col.room{background:rgba(0,0,0,.2)}
.desk-col.mirror{background:rgba(0,0,0,.28)}
@media (max-width:1180px){.desk-body,.desk-body.wide{grid-template-columns:minmax(0,1.1fr) minmax(280px,340px)}.desk-col.run{display:none}}
@media (max-width:820px){.desk-body,.desk-body.wide{grid-template-columns:1fr}.desk-col+.desk-col{border-left:0;border-top:1.5px solid var(--line)}}

/* phone mirror */
.mirror-wrap{position:sticky;top:0}
.phoneframe{background:#000;border-radius:24px;padding:7px;border:1px solid #2A3B39;box-shadow:0 14px 34px rgba(0,0,0,.5);margin:0 auto;max-width:274px}
.phonescreen{background:var(--night);border-radius:18px;overflow:hidden;height:min(560px,58vh);display:flex;flex-direction:column;position:relative;
  background-image:radial-gradient(120% 80% at 50% -10%,#12403C 0%,#07201E 62%)}
.phonescreen .pg-top{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1.5px solid var(--line);font-size:10px}
.phonescreen .pg-top img{height:17px}
.phonescreen .pg-top .sp{flex:1}
.phonescreen .pg-body{flex:1 1 auto;overflow:hidden;padding:13px 13px 6px;font-size:13px;pointer-events:none;
  -webkit-mask-image:linear-gradient(180deg,#000 93%,transparent);mask-image:linear-gradient(180deg,#000 93%,transparent)}
.phonescreen .pg-foot{flex:0 0 auto;padding:8px 12px;border-top:1.5px solid var(--line);background:rgba(0,0,0,.3)}
.phonescreen .pg-body h2{font-size:18px!important}
.phonescreen .pg-body .lead{font-size:13px!important}
.phonescreen .pg-body .watch{padding:22px 8px!important}
.phonescreen .pg-body .watch .em{font-size:34px!important;margin-bottom:10px!important}
.phonescreen .pg-body .watch h2{font-size:19px!important}
.phonescreen .pg-body .watch p{font-size:12.5px!important}
.phonescreen .pg-body .taps button{padding:7px 11px;font-size:11.5px}
.phonescreen .pg-body .opts button{padding:9px 11px;font-size:12px}
.phonescreen .pg-body .scorer button{border-radius:9px}
.phonescreen .pg-body .beerhead .sw{width:40px;height:40px}
.phonescreen .pg-body .beerhead .sw img{max-height:32px}
.phonescreen .pg-body .beerhead .nm{font-size:17px}
.phonescreen .pg-body .card,.phonescreen .pg-body .liveblock{padding:10px 11px;font-size:12px}
.phonescreen .pg-body .sens{grid-template-columns:28px 1fr;gap:9px;margin-bottom:10px}
.phonescreen .pg-body .sens .ic{width:28px;height:28px}
.phonescreen .pg-body .sens .ic svg{width:15px;height:15px}
.phonescreen .pg-body .sens p{font-size:12px}
.phonescreen .pg-body img{border-radius:8px}
.mirror-note{font-size:11.5px;color:var(--dim-2);text-align:center;margin:10px 0 0;line-height:1.45}
.mirror-note b{color:var(--larry);display:block;font-family:var(--f-disp);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}

/* view switcher */
.views{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.views a,.views button{font-size:12px;font-weight:700;padding:7px 11px;border-radius:9px;border:1.5px solid var(--line);background:var(--night-2);color:var(--cream);text-decoration:none;white-space:nowrap}
.views a:hover,.views button:hover{border-color:var(--teal);background:var(--night-3)}
.views .cur{background:var(--teal);border-color:var(--teal);color:#04211F}
.views .home{padding:7px 10px}
.desk h4{font-family:var(--f-disp);font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim-2);margin:0 0 11px}
.desk .grp{margin-bottom:24px}
.cuelist{display:grid;gap:3px}
.cuebtn{display:grid;grid-template-columns:22px 1fr;gap:9px;align-items:baseline;text-align:left;padding:7px 9px;border-radius:8px;font-size:13px;line-height:1.3;color:var(--dim);transition:background .12s}
.cuebtn:hover{background:var(--night-2)}
.cuebtn b{font-variant-numeric:tabular-nums;font-size:11px;color:var(--dim-2);font-weight:800}
.cuebtn[aria-current="true"]{background:var(--teal);color:#04211F;font-weight:800}
.cuebtn[aria-current="true"] b{color:#04211F}
.cuebtn.head{margin-top:12px;color:var(--teal-lt);font-family:var(--f-disp);font-size:11px;letter-spacing:.14em;text-transform:uppercase;pointer-events:none;grid-template-columns:1fr}
.saybox{background:var(--night-2);border:1.5px solid var(--line);border-radius:var(--r);padding:18px 19px;margin-bottom:14px}
.saybox ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.saybox li{font-size:clamp(16px,1.5vw,20px);line-height:1.45;position:relative;padding-left:20px}
.saybox li::before{content:"";position:absolute;left:0;top:.6em;width:8px;height:8px;background:var(--teal);transform:rotate(45deg);border-radius:2px}
.watchbox{background:rgba(242,230,75,.1);border:1.5px solid rgba(242,230,75,.35);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.45;color:#F6EDA0;margin-bottom:14px}
.watchbox b{display:block;font-family:var(--f-disp);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--larry);margin-bottom:3px}
.deskbeer{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.deskbeer .sw{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;overflow:hidden}
.deskbeer .sw img{max-height:46px;width:auto}
.deskbeer .nm{display:block;font-family:var(--f-disp);font-size:24px;line-height:1}
.deskbeer .st{display:block;font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums;margin-top:3px}
.factgrid{display:grid;gap:9px}

/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 live backend \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550
   Two ways to go live, tried in this order:
     1. A Firebase Realtime Database URL in TASTING_MATE_DB (works on any host)
     2. The claude.ai artifact data layer (only inside claude.ai)
   Neither = solo mode: every phone keeps its own notes and nothing syncs.

   The beer library always lives in this browser. The beers for tonight
   travel inside the session state, so guests get the right lineup without
   needing the library. */

const DB_URL = () => S.dbBase || String((typeof window !== 'undefined' && window.TASTING_MATE_DB) || '').trim().replace(/\/+$/, '');
const ROOM = 'main';

/* Firebase puts Realtime Databases on a different hostname per region,
   and the console URL doesn't tell you which. Rather than make anyone
   hunt for it, try the handful of possibilities once and remember the
   one that answers. An explicit TASTING_MATE_DB always wins. */
const RTDB_HOSTS = p => [
  'https://' + p + '-default-rtdb.asia-southeast1.firebasedatabase.app',
  'https://' + p + '-default-rtdb.firebaseio.com',
  'https://' + p + '-default-rtdb.us-central1.firebasedatabase.app',
  'https://' + p + '-default-rtdb.europe-west1.firebasedatabase.app'
];

async function resolveDB() {
  const explicit = String((typeof window !== 'undefined' && window.TASTING_MATE_DB) || '').trim().replace(/\/+$/, '');
  if (explicit) { S.dbHow = 'set in the file'; return explicit; }

  const proj = String((typeof window !== 'undefined' && window.TASTING_MATE_PROJECT) || '').trim();
  if (!proj) return '';

  const cached = LS.get('dburl');
  if (cached && cached.p === proj && cached.u) { S.dbHow = 'remembered from last time'; return cached.u; }

  for (const h of RTDB_HOSTS(proj)) {
    try {
      const r = await fetch(h + '/s/' + ROOM + '/ping.json', { method: 'GET' });
      // any HTTP answer proves the database exists on this host;
      // 401/403 just means the rules are locked down
      if (r.ok || r.status === 401 || r.status === 403) {
        LS.set('dburl', { p: proj, u: h });
        S.dbHow = 'found automatically';
        if (!r.ok) S.liveError = 'Found the database, but it refused the read. Check your rules allow /s.';
        return h;
      }
    } catch (e) { /* no database on that host \u2014 try the next */ }
  }
  S.liveError = 'Could not find a database for project "' + proj + '". Check the project name, and that you created a Realtime Database (not Firestore).';
  return '';
}

function setDeep(obj, path, val) {
  const parts = String(path).split('/').filter(Boolean);
  if (!parts.length) return val;
  let o = obj;
  for (let i = 0; i < parts.length - 1; i++) { if (typeof o[parts[i]] !== 'object' || o[parts[i]] === null) o[parts[i]] = {}; o = o[parts[i]]; }
  const last = parts[parts.length - 1];
  if (val === null) delete o[last]; else o[last] = val;
  return obj;
}

function firebaseLive(base) {
  const url = p => base + '/s/' + ROOM + '/' + p + '.json';
  const put = (p, d) => fetch(url(p), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(d === undefined ? null : d) })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r; });
  function stream(p, cb) {
    let es;
    try { es = new EventSource(url(p)); } catch (e) { return; }
    const on = e => { try { const m = JSON.parse(e.data); cb(m.path, m.data); } catch (err) {} };
    es.addEventListener('put', on);
    es.addEventListener('patch', on);
    es.addEventListener('cancel', () => { S.liveError = 'The database rejected the connection. Check your rules.'; render(); });
    es.onerror = () => { /* EventSource retries by itself */ };
  }
  return {
    kind: 'firebase',
    onState(cb) { let cur = null; stream('state', (path, data) => { cur = (path === '/') ? data : setDeep(cur || {}, path, data); cb(cur); }); },
    setState(o) { return put('state', o); },
    onGuests(cb) { let g = {}; stream('guests', (path, data) => { g = (path === '/') ? (data || {}) : setDeep(g, path, data); cb(Object.keys(g).map(id => ({ id, ...g[id] }))); }); },
    setGuest(id, o) { return put('guests/' + id, o); },
    clearGuests() { return put('guests', null); },
    sendCheers(n, from) { return put('cheers', { t: Date.now(), n, from }); },
    onCheers(cb) { let first = true; stream('cheers', (p, d) => { if (first) { first = false; return; } if (d && d.t) cb(d); }); },
    test() { return put('ping', { t: Date.now() }).then(() => fetch(url('ping')).then(r => r.json())); }
  };
}

function claudeLive(db, room) {
  return {
    kind: 'claude',
    onState(cb) { db.doc('session/state').onSnapshot(s => cb(s.exists ? s.data() : null), () => {}); },
    setState(o) { return db.doc('session/state').set(o); },
    onGuests(cb) { db.collection('guests').limit(300).onSnapshot(s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), () => {}); },
    setGuest(id, o) { return db.doc('guests/' + id).set(o); },
    clearGuests() { return db.collection('guests').get().then(s => Promise.all(s.docs.map(d => db.doc('guests/' + d.id).delete()))); },
    sendCheers(n, from) { try { room && room.emit('cheers', { n, from }); } catch (e) {} return Promise.resolve(); },
    onCheers(cb) { try { room && room.on('cheers', cb); } catch (e) {} },
    test() { return db.doc('session/ping').set({ t: Date.now() }).then(() => ({ ok: true })); }
  };
}

async function connect() {
  if (S.dbTried) return; S.dbTried = true;

  const base = await resolveDB();
  if (base) {
    S.dbBase = base;
    S.live = firebaseLive(base);
  } else {
    let db = null, room = null;
    try { db = await claude.use('db'); room = await claude.use('room'); } catch (e) { /* design for absence */ }
    if (db) S.live = claudeLive(db, room);
  }

  if (S.live) {
    S.connected = true;
    S.live.onState(st => {
      if (!st) return;
      adoptSession(st);
      S.session = { ...newSession(), ...st };
      LS.set('session', S.session);
      render();
    });
    S.live.onGuests(list => { S.guests = list || []; if (S.role === 'desk' || S.role === 'screen') render(); });
    S.live.onCheers(m => rain(m && m.n ? m.n : 3));

    /* Finding the database takes a moment. Anyone who typed their name
       before it landed -- or who reloaded their phone mid-session and
       skipped the join screen -- has never been announced. Do it now. */
    if (S.me.name) pushMine();
  }
  render();
}

/* the beers for tonight ride along inside the session so guests don't
   need the library; images are stripped to keep the payload small */
function lineupPayload(lineup) {
  const out = {};
  (lineup || []).forEach(id => {
    const b = S.beers.find(x => x.id === id);
    if (!b) return;
    const { image, ...rest } = b;
    out[id] = rest;
  });
  return out;
}

async function pushSession(patch) {
  S.session = { ...S.session, ...patch };
  if (patch.lineup || !S.session.beers) S.session.beers = lineupPayload(S.session.lineup);
  LS.set('session', S.session);
  render();
  if (S.live) {
    try { await S.live.setState(S.session); }
    catch (e) { S.liveError = 'Could not reach the database. The desk is still driving locally.'; render(); }
  }
}

/* A phone in a festival crowd drops its signal now and then. If a push
   fails the taster would quietly vanish from the desk, so keep trying in
   the background until one lands. */
let mineT, mineRetry;
function pushMine() {
  if (!S.live || !S.me.name) return;
  clearTimeout(mineT);
  mineT = setTimeout(() => {
    S.live.setGuest(S.me.id, { name: S.me.name, at: Date.now(), ...S.mine })
      .then(() => { clearInterval(mineRetry); mineRetry = null; })
      .catch(() => { if (!mineRetry) mineRetry = setInterval(pushMine, 6000); });
  }, 260);
}

async function newRoom() {
  S.mine = blankMine();
  LS.set('mine', S.mine);
  S.guests = [];
  if (S.live) { try { await S.live.clearGuests(); } catch (e) {} }
  /* a new id is what tells every phone still sitting on the page to
     forget its name and its notes. Without it they quietly re-publish
     the last session's scores the moment anyone taps anything. */
  const sid = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  LS.set('sid', sid);
  await pushSession({ cue: 0, startedAt: null, sid });
  flash('Fresh session \u2014 every phone cleared');
}

function blankMine() { return { scores: {}, aromas: {}, trivia: {}, nose: null, cheers: 0, email: '' }; }

/* Called whenever session state arrives. If the desk has started a new
   session since this device last looked, wipe everything local. */
function adoptSession(st) {
  const sid = st && st.sid;
  if (!sid) return;
  const known = LS.get('sid', null);
  if (known === null) { LS.set('sid', sid); return; }   // first ever look
  if (known === sid) return;
  LS.set('sid', sid);
  S.mine = blankMine();
  LS.set('mine', S.mine);
  if (S.role === 'guest') { S.me.name = ''; LS.set('me', S.me); }
  S.emailSent = false;
}

/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 aggregates \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */

function scoreStats(beerId) {
  const counts = [0, 0, 0, 0, 0]; let n = 0, sum = 0;
  S.guests.forEach(g => { const v = g.scores && g.scores[beerId]; if (v >= 1 && v <= 5) { counts[v - 1]++; n++; sum += v; } });
  if (!S.live) { const v = S.mine.scores[beerId]; if (v) { counts[v - 1]++; n++; sum += v; } }
  return { counts, n, avg: n ? sum / n : 0 };
}
function aromaStats(beerId) {
  const m = {};
  S.guests.forEach(g => (g.aromas && g.aromas[beerId] || []).forEach(a => m[a] = (m[a] || 0) + 1));
  return Object.entries(m).sort((a, b) => b[1] - a[1]);
}
function pollStats(key, nOpts) {
  const counts = new Array(nOpts).fill(0); let n = 0;
  S.guests.forEach(g => {
    const v = key === 'nose' ? g.nose : (g.trivia || {})[key];
    if (typeof v === 'number' && v >= 0 && v < nOpts) { counts[v]++; n++; }
  });
  return { counts, n };
}
const triviaIdx = bi => { const t = S.session.triviaFor || []; return typeof t[bi] === 'number' ? t[bi] : bi % TRIVIA.length; };

/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 chrome helpers \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */

let flashT;
function flash(msg, warn) {
  let el = $('#flash');
  if (!el) { el = document.createElement('div'); el.id = 'flash'; el.style.cssText = 'position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:80;background:#07201E;border:1.5px solid #1D4B47;border-radius:22px;padding:10px 18px;font-size:13.5px;font-weight:700;max-width:90vw;text-align:center'; document.body.appendChild(el); }
  el.textContent = msg; el.style.color = warn ? '#FF9E4D' : '#4ED6D0'; el.style.opacity = '1';
  clearTimeout(flashT); flashT = setTimeout(() => el.style.opacity = '0', 3200);
}
function rain(n) {
  const r = $('#rain');
  for (let i = 0; i < Math.min(n, 14); i++) {
    const b = document.createElement('b');
    b.textContent = ['\ud83c\udf7b', '\ud83c\udf7a'][i % 2];
    b.style.left = (6 + Math.random() * 88) + '%';
    b.style.animationDelay = (Math.random() * 0.7) + 's';
    r.appendChild(b); setTimeout(() => b.remove(), 3600);
  }
}

/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 router \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */

const ROUTES = { '#/desk': 'desk', '#/screen': 'screen', '#/guest': 'guest', '#/library': 'library', '#/qr': 'qr', '#/setup': 'setup' };
const guestURL = () => location.origin + location.pathname + '#/guest';

  render();
}

/* Re-rendering throws away scroll position, and scrollIntoView on the
   running order used to drag the whole page down to the sidebar every
   time a cue advanced. Remember where each scrolling panel was, put it
   back, and move the running order only WITHIN its own box. */
function scrollState() {
  const m = {};
  document.querySelectorAll('[data-scroll]').forEach(el => { m[el.getAttribute('data-scroll')] = el.scrollTop; });
  m.__page = window.scrollY;
  return m;
}
function restoreScroll(m) {
  document.querySelectorAll('[data-scroll]').forEach(el => {
    const v = m[el.getAttribute('data-scroll')];
    if (v) el.scrollTop = v;
  });
  if (m.__page) window.scrollTo(0, m.__page);
}
function revealCue() {
  const c = document.querySelector('.cuebtn[aria-current="true"]');
  if (!c) return;
  /* the scroller is the column, not the list. Never scrollIntoView --
     it walks up to the page and drags the whole desk down. */
  let box = c.parentElement;
  while (box && box.scrollHeight <= box.clientHeight + 2) box = box.parentElement;
  if (!box || box === document.body || box === document.documentElement) return;
  const top = c.offsetTop - box.offsetTop, bot = top + c.offsetHeight;
  if (top < box.scrollTop) box.scrollTop = top - 8;
  else if (bot > box.scrollTop + box.clientHeight) box.scrollTop = bot - box.clientHeight + 8;
}

function render() {
  const keep = scrollState();
  const v = S.role === 'desk' ? vDesk() : S.role === 'screen' ? vScreen() : S.role === 'guest' ? vGuest()
    : S.role === 'library' ? vLibrary() : S.role === 'qr' ? vQR() : S.role === 'setup' ? vSetup() : vPick();
  app.innerHTML = v;
  if (S.role === 'screen') afterScreen();
  if (S.role === 'qr') makeQR('qrbig', 300);
  if (S.role === 'desk') makeQR('qrsmall', 150);
  restoreScroll(keep);
  if (S.role === 'desk') { revealCue(); startClock(); }
  if (S.role === 'library') afterLibrary();
}

const sz = (t, a, b) => { const l = (t || '').length; return l > b ? 'sm' : l > a ? 'md' : ''; };
function bar(label, n, total, cls, mk) {
  const pct = total ? Math.round((n / total) * 100) : 0;
  return `<div class="optbar ${cls || ''}"><i style="width:${pct}%"></i><div class="txt">${mk ? `<b class="mk">${mk}</b>` : ''}${label}${cls === 'right' ? '<b class="mk" style="color:var(--sally)">&#10003;</b>' : ''}<span class="n">${n}</span></div></div>`;
}
function cloudHTML(a) {
  if (!a.length) return '';
  const mx = a[0][1];
  return a.map(([w, n]) => {
    const t = n / mx;
    const size = 16 + t * 52;
    return `<b style="font-size:clamp(${(size * 0.6).toFixed(0)}px,${(size / 12).toFixed(1)}vw,${size.toFixed(0)}px);color:${t > .66 ? 'var(--larry)' : t > .33 ? 'var(--teal-lt)' : 'var(--dim)'}">${esc(w)}<span style="font-size:.5em;opacity:.6"> ${n}</span></b>`;
  }).join('');
}

function rail(c, b) {

  if (b) {

      <div class="row"><b>Scores in</b><span class="v">${st.n}</span></div></div></div>`);
    const a = aromaStats(b.id).slice(0, 6);
    if (a.length) parts.push(`<div class="grp"><h4>Top aromas</h4><div class="mini">${a.map(([w, n]) => `<div class="row"><b>${esc(w)}</b><span class="v">${n}</span></div>`).join('')}</div></div>`);

  if (done) parts.push(`<div class="grp"><h4>Running order</h4><div class="mini">${done}</div></div>`);
  return parts.join('');
}

async function runLiveTest() {
  S.liveTest = { running: true }; render();
  const res = { running: false };
  if (!S.live) { res.write = false; res.writeMsg = 'No live layer to test.'; res.read = false; res.readMsg = 'No live layer to test.'; }
  else {
    try { await S.live.test(); res.write = true; res.writeMsg = 'Wrote a test value successfully.'; }
    catch (e) { res.write = false; res.writeMsg = String(e && e.message || e); }
    if (res.write) {
      try {
        const back = await S.live.test();
        res.read = !!back; res.readMsg = back ? 'Read the value straight back.' : 'Wrote, but read nothing back.';
      } catch (e) { res.read = false; res.readMsg = String(e && e.message || e); }
    } else { res.read = false; res.readMsg = 'Skipped &mdash; the write failed first.'; }
  }
  S.liveTest = res; render();
}

  if (c.k === 'lobby') {
    return `<div style="display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap">
      <div style="background:#fff;border-radius:14px;padding:12px;line-height:0"><div id="qrsmall" style="width:150px;height:150px"></div></div>
      <div style="flex:1;min-width:200px" class="factgrid">
        <div><span class="k">Guest link</span><p style="word-break:break-all">${esc(guestURL())}</p></div>
        <div><span class="k">For the tables</span><p>Open the <b>Join code</b> view and hit Print &mdash; that gives you an A5 poster to stick on each table.</p></div>
      </div></div>
      <div style="margin-top:14px"><button class="btn" data-nav="#/qr">Open the printable join code</button></div>`;
  }
  if (c.k === 'story') return `<div class="factgrid"><div><span class="k">On their phones</span><p>${STORY[c.i].p}</p></div></div>`;
  if (c.k === 'nose') return `<div class="factgrid"><div><span class="k">The question they see</span><p>${NOSE_TEST.q}</p></div></div>`;
  if (c.k === 'nose-results') return `<div class="factgrid"><div><span class="k">The point</span><p>${NOSE_TEST.reveal.replace(/<[^>]+>/g, '')}</p></div></div>`;
  if (!b) return '';
  const g = [];
  if (c.k === 'pour') g.push(['Hops', b.hops], ['Malt', b.malt], ['Yeast', b.yeast]);
  if (c.k === 'look') g.push(['Look', b.look]);
  if (c.k === 'smell' || c.k === 'smell-results') g.push(['On the can', b.aroma]);
  if (c.k === 'taste' || c.k === 'taste-results') g.push(['Taste', b.taste]);
  if (c.k === 'reveal') g.push(['Talking point', b.talk], ['Goes with', b.food], ['Look', b.look], ['Smell', b.aroma], ['Taste', b.taste]);
  if (c.k === 'fact') g.push(['Fun fact', b.fact], ['Character', b.mate]);
  if (c.k === 'trivia' || c.k === 'trivia-results') {
    const q = TRIVIA[triviaIdx(c.bi)];
    g.push(['Question', q.q.replace(/<[^>]+>/g, '')], ['Answer', q.o[q.a]], ['Explanation', q.e]);
  }
  /* whatever the cue, keep the whole spec sheet for this beer within
     reach -- punters ask about ABV and hops at random moments */
  const spec = [['Style', b.style + ' \u00b7 ' + b.abv + '%' + (b.ibu ? ' \u00b7 IBU ' + b.ibu : '')],
    ['Hops', b.hops], ['Malt', b.malt], ['Yeast', b.yeast], ['Look', b.look],
    ['Smell', b.aroma], ['Taste', b.taste], ['Goes with', b.food],
    ['Talking point', b.talk], ['Fun fact', b.fact], ['Character', b.mate]]
    .filter(([, v]) => v && !g.some(x => x[1] === v));
  return (g.length ? `<div class="factgrid">${g.map(([k, v]) => `<div><span class="k">${k}</span><p>${v}</p></div>`).join('')}</div>` : '')
    + `<details class="specs"><summary>All of ${esc(b.name)}&rsquo;s notes</summary>
       <div class="factgrid">${spec.map(([k, v]) => `<div><span class="k">${k}</span><p>${v}</p></div>`).join('')}</div></details>`;
}

function deskRoom(c, b) {
  const out = [];
  const named = S.guests.filter(g => g.name);
  if (!S.connected) out.push(`<div class="banner"><b>No live feed</b>Phones aren&rsquo;t reporting back in this build, so there&rsquo;s nothing to read here. Your notes on the left still work \u2014 ask the room out loud instead. Hands up beats a bar chart anyway.</div>`);

  if (c.k === 'nose' || c.k === 'nose-results') {
    const p = pollStats('nose', NOSE_TEST.opts.length);
    out.push(`<div class="grp"><h4>${NOSE_TEST.q}</h4><div class="bigstat"><b>${p.n}</b><span>answered</span></div>
      <div class="barlist">${NOSE_TEST.opts.map((o, i) => rowBar(o, p.counts[i], p.n)).join('')}</div></div>`);
  }
  if (b) {
    const a = aromaStats(b.id);
    if (['smell', 'smell-results', 'taste', 'taste-results', 'reveal'].indexOf(c.k) > -1) {
      const mx = a.length ? a[0][1] : 1;
      out.push(`<div class="grp"><h4>What they&rsquo;re smelling</h4>${a.length
        ? `<div class="chipline">${a.map(([w, n2]) => `<span class="${n2 >= mx * .75 ? 'hot' : ''}">${esc(w)}<i>${n2}</i></span>`).join('')}</div>`
        : '<p style="color:var(--dim-2);font-size:13px;margin:0">Nothing tapped yet.</p>'}</div>`);
    }
    const st = scoreStats(b.id);
    if (['taste', 'taste-results', 'reveal', 'fact', 'trivia', 'trivia-results'].indexOf(c.k) > -1) {
      const mx = Math.max(1, ...st.counts);
      out.push(`<div class="grp"><h4>${esc(b.name)} score</h4>
        <div class="bigstat"><b>${st.n ? st.avg.toFixed(1) : '\u2013'}</b><span>out of 5 &middot; ${st.n} ${st.n === 1 ? 'vote' : 'votes'}</span></div>
        <div class="mhist">${st.counts.map((v, i) => `<div class="c"><div class="v">${v || ''}</div><div class="b" style="height:${(v / mx) * 100}%;background:${b.colour}"></div><div class="l">${i + 1}</div></div>`).join('')}</div></div>`);
    }
  }
  if (c.k === 'trivia' || c.k === 'trivia-results') {
    const qi = triviaIdx(c.bi), q = TRIVIA[qi], p = pollStats(String(qi), q.o.length);
    out.push(`<div class="grp"><h4>Trivia &middot; ${p.n} answered</h4>
      <div class="barlist">${q.o.map((o, i) => rowBar(o, p.counts[i], p.n, i === q.a)).join('')}</div></div>`);
  }
  const done = (S.session.lineup || []).map(id => {
    const bb = S.beers.find(x => x.id === id), st = scoreStats(id);
    return bb && st.n ? `<div class="barrow"><i style="width:${(st.avg / 5) * 100}%"></i><div class="t">${esc(bb.name)}<span class="n">${st.avg.toFixed(1)}</span></div></div>` : '';
  }).join('');
  if (done) out.push(`<div class="grp"><h4>Scores so far</h4><div class="barlist">${done}</div></div>`);
  out.push(`<div class="grp"><h4>In the room &middot; ${named.length}</h4><div class="chipline">${named.length ? named.map(g => `<span>${esc(g.name)}</span>`).join('') : '<span style="color:var(--dim-2)">Nobody yet</span>'}</div></div>`);

  /* Sign-ups are held for the session only and go when you reset, so
     take them with you before you hit New session. */
  const em = emailList();
  out.push(`<div class="grp"><h4>Sign-ups &middot; ${em.length}</h4>
    ${em.length
      ? `<div class="emlist">${em.map(x => `<div><b>${esc(x.name)}</b><span>${esc(x.email)}</span></div>`).join('')}</div>
         <div class="emacts"><button class="ctlbtn" data-copyemails>Copy all</button><button class="ctlbtn" data-csvemails>Download CSV</button></div>
         <p class="warn">Not stored anywhere. Grab these before you hit New session.</p>`
      : '<p style="color:var(--dim-2);font-size:13px;margin:0">None yet. The box appears on their last slide.</p>'}</div>`);
  return out.join('');
}

function emailList() {
  return S.guests.filter(g => g.email).map(g => ({ name: g.name || '', email: g.email }));
}
function copyEmails() {
  const txt = emailList().map(x => x.email).join(', ');
  if (!txt) { flash('No sign-ups yet', true); return; }
  try { navigator.clipboard.writeText(txt); flash(emailList().length + ' copied to the clipboard'); }
  catch (e) { prompt('Copy these:', txt); }
}
function csvEmails() {
  const rows = emailList();
  if (!rows.length) { flash('No sign-ups yet', true); return; }
  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const csv = 'name,email\n' + rows.map(r => q(r.name) + ',' + q(r.email)).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = 'tasting-signups-' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  flash(rows.length + ' downloaded');
}

function rowBar(label, n, total, right) {
  const pct = total ? Math.round((n / total) * 100) : 0;
  return `<div class="barrow ${right ? 'right' : ''}"><i style="width:${pct}%"></i><div class="t">${label}${right ? ' <b style="color:var(--sally)">&#10003;</b>' : ''}<span class="n">${n}</span></div></div>`;
}

/* \u2500\u2500 compact live results for a phone \u2500\u2500 */
function liveCloud(b) {
  const a = aromaStats(b.id); if (!a.length) return '';
  const mx = a[0][1];
  return `<div class="liveblock"><div class="hd"><span class="kick">The room right now</span><span class="live"><i></i>Live</span></div>
    <div class="chipline">${a.map(([w, n]) => `<span class="${n >= mx * .75 ? 'hot' : ''}">${esc(w)}<i>${n}</i></span>`).join('')}</div></div>`;
}
function liveHist(b) {
  const st = scoreStats(b.id); if (!st.n) return '';
  const mx = Math.max(1, ...st.counts);
  return `<div class="liveblock"><div class="hd"><span class="kick">The room right now</span><span class="live"><i></i>${st.n} in</span></div>
    <div class="bigstat" style="margin-bottom:2px"><b style="font-size:32px">${st.avg.toFixed(1)}</b><span>out of 5</span></div>
    <div class="mhist">${st.counts.map((v, i) => `<div class="c"><div class="v">${v || ''}</div><div class="b" style="height:${(v / mx) * 100}%;background:${b.colour}"></div><div class="l">${i + 1}</div></div>`).join('')}</div></div>`;
}
function livePoll(key, opts, correct) {
  const p = pollStats(key, opts.length); if (!p.n) return '';
  return `<div class="liveblock"><div class="hd"><span class="kick">The room right now</span><span class="live"><i></i>${p.n} in</span></div>
    <div class="barlist">${opts.map((o, i) => rowBar(o, p.counts[i], p.n, correct === i)).join('')}</div></div>`;
}

/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 guest \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */

function vGuest() {
  const c = cue(), b = c.bi != null ? beerAt(c.bi) : null;
  const head = `<header class="g-top">${LS.get('staff') ? '<button data-nav="#/" title="All views" aria-label="All views" style="color:var(--dim-2);font-size:15px;padding:0 2px">&#9776;</button>' : ''}<img src="${A.logo_cream}" alt="Your Mates"><span class="sp"></span>${S.me.name ? `<span class="me">${esc(S.me.name)}</span>` : ''}${S.connected ? '<span class="live"><i></i>Live</span>' : '<span class="pill">Solo</span>'}</header>`;
  if (!S.me.name) {
    return `<div class="g">${head}<div class="g-body fade"><h2 class="disp">What should we call you?</h2>
      <p class="lead">Just a first name. It shows up on the big screen when you join, and next to nothing else.</p>
      <div class="namebox"><input class="inp" id="nm" placeholder="Your name" maxlength="18" autocomplete="given-name">
      <button class="btn wide" data-join>Join the tasting</button></div>
      ${S.connected ? '' : `<div class="banner" style="margin-top:20px"><b>Your own tasting card</b>Everything you tap stays on your phone. Score the beers, keep your notes, and take them home with you.</div>`}
      </div></div>`;
  }
  return `<div class="g">${head}<div class="g-body">${gBody(c, b)}</div>${gFoot(c, b)}</div>`;
}

function watch(em, h, p) { return `<div class="watch fade"><div class="em">${em}</div><h2 class="disp">${h}</h2><p>${p}</p></div>`; }
const phonesOnly = () => (S.session.mode || 'phones') === 'phones';
const lookUp = () => phonesOnly() ? 'Ears up \u2014 the good bit is the bloke with the microphone.' : 'Eyes up front for this bit.';

function gBody(c, b) {
  switch (c.k) {
    case 'lobby': return `<div class="fade">${watch('\ud83c\udf7a', 'You&rsquo;re in.', phonesOnly() ? 'Grab a glass. Your phone will follow along on its own &mdash; we&rsquo;ll tell you when there&rsquo;s something to tap.' : 'Grab a glass and keep an eye on the big screen. We&rsquo;ll tell you when there&rsquo;s something to tap.')}
      <img src="${A.ph_pitch}" alt="" style="border-radius:12px;display:block;width:100%;margin-top:4px">
      <p style="margin:10px 0 0;font-size:13px;color:var(--dim-2);text-align:center">Your Mates Brewing Co. \u2014 Sunshine Coast, QLD</p></div>`;
    case 'story': { const st = STORY[c.i];
      return `<div class="fade"><span class="kick">${st.k}</span><h2 class="disp" style="margin-top:8px">${st.h}</h2>
        <p class="lead">${st.p}</p>${st.quote ? `<p class="disp" style="font-size:22px;color:var(--larry);margin:0">&ldquo;${st.quote}&rdquo;</p>` : ''}
        ${st.img ? `<img src="${A[st.img]}" alt="" style="border-radius:12px;display:block;margin-top:14px">` : ''}</div>`; }
    case 'howto-intro': return `<div class="fade"><span class="kick">Before we start drinking</span>
      <h2 class="disp" style="margin-top:8px">Three steps. In this order.</h2>
      <p class="lead">You can already taste beer. This is just the words for what you&rsquo;re doing.</p>
      <div class="taps" style="pointer-events:none">${HOWTO.map((h, i) => `<button>${i + 1}. ${h.n}</button>`).join('')}</div></div>`;
    case 'howto': { const h = HOWTO[c.i]; return `<div class="fade"><span class="kick">Step ${c.i + 1} of 3</span><h2 class="disp" style="margin-top:8px">${h.n}</h2><p class="lead">${h.p}</p><div class="card"><span class="kick" style="color:var(--larry)">Try this</span><p style="margin:6px 0 0;font-size:14.5px;line-height:1.5">${h.tip}</p></div></div>`; }
    case 'nose': return `<div class="fade"><span class="kick">Everyone at once</span><h2 class="disp" style="margin-top:8px">${NOSE_TEST.h}</h2>
      <ol style="list-style:none;padding:0;margin:0 0 20px;display:grid;gap:10px">${NOSE_TEST.steps.map((s, i) => `<li style="display:grid;grid-template-columns:26px 1fr;gap:11px"><b class="disp" style="color:var(--teal-lt)">${i + 1}</b><span style="font-size:15px">${s}</span></li>`).join('')}</ol>
      <p class="lead" style="margin-bottom:8px">${NOSE_TEST.q}</p>
      <div class="opts">${NOSE_TEST.opts.map((o, i) => `<button data-nose="${i}" aria-pressed="${S.mine.nose === i}">${o}</button>`).join('')}</div></div>`;
    case 'nose-results': return `<div class="fade">${answered(S.mine.nose != null ? NOSE_TEST.opts[S.mine.nose] : null)}${livePoll('nose', NOSE_TEST.opts)}<div class="card" style="margin-top:14px"><p style="margin:0;font-size:15px;line-height:1.55">${NOSE_TEST.reveal}</p></div></div>`;
    case 'glossary': return `<div class="fade"><h2 class="disp">The jargon</h2><div style="display:grid;gap:10px">${GLOSSARY.map(([t, d]) => `<div class="card"><b class="disp" style="color:var(--teal-lt);font-size:16px">${t}</b><p style="margin:5px 0 0;font-size:14px;color:var(--dim);line-height:1.45">${d}</p></div>`).join('')}</div></div>`;
    case 'pour': return `<div class="fade">${beerHead(b)}<p class="lead">Coming up next. Hold off until everyone&rsquo;s poured.</p>
      <div class="card"><span class="kick">In the glass</span><p style="margin:6px 0 0;font-size:14.5px;line-height:1.5;color:var(--dim)">${esc(b.hops)} &middot; ${esc(b.malt)}</p></div></div>`;
    case 'look': return `<div class="fade">${beerHead(b)}<div class="sens"><span class="ic">${I.eye}</span><div><b>Look</b><p>${esc(b.look)}</p></div></div>
      <div style="display:grid;place-items:center;padding:14px 0">${glass(b.colour, 150)}</div></div>`;
    case 'smell': {
      const sel = S.mine.aromas[b.id] || [];
      return `<div class="fade">${beerHead(b)}<div class="sens"><span class="ic">${I.nose}</span><div><b>Smell</b><p>Three short sniffs. Tap everything you get &mdash; as many as you like.</p></div></div>
        <div class="taps">${(b.chips || []).map(ch => `<button data-aroma="${esc(ch)}" aria-pressed="${sel.indexOf(ch) > -1}">${esc(ch)}</button>`).join('')}</div>
        <p style="color:var(--dim-2);font-size:13px;margin:0">${sel.length ? sel.length + ' tapped.' : 'Nothing tapped yet.'}</p>${liveCloud(b)}</div>`;
    }
    case 'smell-results': return `<div class="fade">${beerHead(b)}${liveCloud(b)}<div class="card" style="margin-top:14px"><span class="kick">What we put on the can</span><p style="margin:6px 0 0;font-size:15px;line-height:1.55">${esc(b.aroma)}</p></div></div>`;
    case 'taste': {
      const r = S.mine.scores[b.id] || 0;
      return `<div class="fade">${beerHead(b)}<div class="sens"><span class="ic">${I.mouth}</span><div><b>Taste</b><p>Let it coat your tongue. Then score it.</p></div></div>
        <div class="scorer">${[1, 2, 3, 4, 5].map(n => `<button data-score="${n}" aria-pressed="${r >= n}" aria-label="${n} out of 5">${glass(r >= n ? b.colour : '#1D4B47', 54)}</button>`).join('')}</div>
        <div class="scale-lbl"><span>Not for me</span><span>Take me home</span></div>${r ? liveHist(b) : ''}</div>`;
    }
    case 'taste-results': return `<div class="fade">${beerHead(b)}${answered(S.mine.scores[b.id] ? S.mine.scores[b.id] + ' out of 5' : null)}${liveHist(b) || '<p class="lead">No scores in yet.</p>'}</div>`;
    case 'reveal': return `<div class="fade">${beerHead(b)}
      <div class="sens"><span class="ic">${I.eye}</span><div><b>Look</b><p>${esc(b.look)}</p></div></div>
      <div class="sens"><span class="ic">${I.nose}</span><div><b>Smell</b><p>${esc(b.aroma)}</p></div></div>
      <div class="sens"><span class="ic">${I.mouth}</span><div><b>Taste</b><p>${esc(b.taste)}</p></div></div>
      <div class="sens"><span class="ic">${I.food}</span><div><b>Goes with</b><p>${b.food}</p></div></div></div>`;
    case 'fact': return `<div class="fade">${beerHead(b)}<div class="card" style="background:var(--night-3)"><span class="kick" style="color:var(--larry)">Fun fact</span><p style="margin:7px 0 0;font-size:16px;line-height:1.5">${esc(b.fact)}</p></div>
      <p class="lead" style="margin-top:14px">${esc(b.mate)}</p></div>`;
    case 'trivia': { const qi = triviaIdx(c.bi), q = TRIVIA[qi], mine = (S.mine.trivia || {})[qi];
      return `<div class="fade"><span class="kick">Trivia</span><h2 class="disp" style="margin-top:8px">${q.q}</h2>
        <div class="opts">${q.o.map((o, i) => `<button data-triv="${qi}" data-o="${i}" aria-pressed="${mine === i}"><b class="mk">${'ABC'[i]}</b>${o}</button>`).join('')}</div>
        ${mine != null ? '<p style="color:var(--dim-2);font-size:13px;margin-top:12px">Locked in. You can change it until the answer goes up.</p>' : ''}
        ${mine != null ? livePoll(String(qi), q.o) : ''}</div>`; }
    case 'trivia-results': { const qi = triviaIdx(c.bi), q = TRIVIA[qi], mine = (S.mine.trivia || {})[qi];
      return `<div class="fade"><h2 class="disp">${mine === q.a ? 'Got it.' : mine == null ? 'You sat that one out.' : 'Not this time.'}</h2>
        <div class="opts">${q.o.map((o, i) => `<button data-r="${i === q.a ? 1 : (i === mine ? 0 : '')}" disabled><b class="mk">${'ABC'[i]}</b>${o}${i === q.a ? '<span class="mk end" style="color:var(--sally)">&#10003;</span>' : (i === mine ? '<span class="mk end" style="color:var(--coral)">&times;</span>' : '')}</button>`).join('')}</div>
        ${livePoll(String(qi), q.o, q.a)}
        <div class="card" style="margin-top:14px"><p style="margin:0;font-size:14.5px;line-height:1.55">${q.e}</p></div></div>`; }
    case 'wrap': {
      const mine = Object.entries(S.mine.scores).sort((a, b2) => b2[1] - a[1])[0];
      const fav = mine ? S.beers.find(x => x.id === mine[0]) : null;
      return `<div class="fade"><span class="kick">Your night</span><h2 class="disp" style="margin-top:8px">${fav ? 'Your pick was ' + esc(fav.name) + '.' : 'Thanks for coming.'}</h2>
        ${fav ? `<p class="lead">You gave it ${mine[1]} out of 5.</p>${beerHead(fav)}` : ''}
        ${roomWinner()}
        <div class="card"><span class="kick">Everything you tapped</span><p style="margin:7px 0 0;font-size:14.5px;line-height:1.6;color:var(--dim)">${Object.values(S.mine.aromas).flat().filter((v, i, s) => s.indexOf(v) === i).map(esc).join(' &middot; ') || 'Nothing \u2014 next time, get your nose in there.'}</p></div></div>`;
    }
    case 'cheers': {
      const sent = S.mine.email;
      return `<div class="fade"><div class="watch"><div class="em">\ud83c\udf7b</div><h2 class="disp">Cheers, mate.</h2><p>Hit the button below. Everyone&rsquo;s goes off at once.</p></div>
        <div class="signup">
          <span class="kick">Before you go</span>
          <h3 class="disp">Keep up with us</h3>
          ${sent
            ? `<p class="done">\u2713 You&rsquo;re on the list &mdash; ${esc(sent)}</p><button class="lnk" data-unemail>Not that one? Change it</button>`
            : `<p class="sub">New beers, brewery events and the odd bit of nonsense. No spam, and you can get off the list any time.</p>
               <div class="namebox"><input class="inp" id="em" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" maxlength="80">
               <button class="btn wide" data-email>Keep me posted</button></div>`}
          <div class="socials">
            <a href="https://yourmatesbrewing.com" target="_blank" rel="noopener">yourmatesbrewing.com</a>
            <span>Instagram &amp; Facebook &mdash; <b>@yourmatesbrewing</b></span>
          </div>
        </div></div>`;
    }
  }
  return '';
}

function roomWinner() {
  const ranked = (S.session.lineup || []).map(id => { const bb = S.beers.find(x => x.id === id); const st = scoreStats(id); return bb && st.n ? { b: bb, st } : null; })
    .filter(Boolean).sort((x, y) => y.st.avg - x.st.avg);
  if (!ranked.length) return '';

function afterLibrary() {
  const f = $('#filein'), drop = document.querySelector('[data-pick]');
  if (drop && f) {
    drop.onclick = () => f.click();
    f.onchange = async () => {
      const file = f.files && f.files[0]; if (!file) return;
      try {
        const data = await shrink(file);
        const b = S.beers.find(x => x.id === S.libSel); if (!b) return;
        b.image = data; await saveBeer(b); render(); flash('Image added');
      } catch { flash('Could not read that image', true); }
    };
  }
  const bi = $('#beersin');
  if (bi) bi.onchange = () => {
    const f = bi.files && bi.files[0]; if (!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const list = JSON.parse(fr.result);
        if (!Array.isArray(list)) throw new Error('not a list');
        let added = 0;
        list.forEach(b => { if (b && b.id) { S.beers = S.beers.filter(x => x.id !== b.id).concat([b]); added++; } });
        LS.set('beers', S.beers); render(); flash(added + ' beers imported');
      } catch (e) { flash('That file didn\u2019t look like a beer library', true); }
    };
    fr.readAsText(f);
  };
  const nc = $('#newchip');
  if (nc) nc.onkeydown = e => {
    if (e.key !== 'Enter') return;
    const v = nc.value.trim(); if (!v) return;
    const b = S.beers.find(x => x.id === S.libSel); if (!b) return;
    b.chips = (b.chips || []).concat(v); saveBeer(b); render();
  };
}

async function exportBeers() {
  const data = JSON.stringify(S.beers, null, 2);

    if (dl) { await dl.save({ filename, data }); flash('Library exported'); return; }
  } catch (e) { /* not inside claude.ai, or declined */ }
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    flash('Library exported');
  } catch (e) { flash('Could not export here \u2014 try the hosted version', true); }
}

function shrink(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const im = new Image();
      im.onerror = rej;
      im.onload = () => {
        const max = 520, sc = Math.min(1, max / Math.max(im.width, im.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(im.width * sc); cv.height = Math.round(im.height * sc);
        cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
        res(cv.toDataURL('image/webp', 0.8));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

async function saveBeer(b) {

  LS.set('beers', S.beers);
  if ((S.session.lineup || []).indexOf(b.id) > -1) await pushSession({ beers: lineupPayload(S.session.lineup) });

/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 events \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-nav],[data-cue],[data-goto],[data-mode],[data-newroom],[data-testlive],[data-full],[data-jump],[data-join],[data-aroma],[data-score],[data-triv],[data-nose],[data-cheers],[data-sel],[data-lineup],[data-newbeer],[data-seed],[data-save],[data-del],[data-delchip],[data-clearimg],[data-exportbeers],[data-importbeers],[data-email],[data-unemail],[data-target],[data-copyemails],[data-csvemails]');
  if (!t) return;

  if (t.dataset.nav) { goHash(t.dataset.nav); return; }
  if (t.hasAttribute('data-full')) {
    try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch {}
    return;
  }
  if (t.dataset.cue) { step(+t.dataset.cue); return; }
  if (t.dataset.goto) { pushSession({ cue: +t.dataset.goto }); return; }
  if (t.dataset.mode) { pushSession({ mode: t.dataset.mode }); return; }
  if (t.hasAttribute('data-newroom')) {
    if (S.guests.length && !confirm('Clear ' + S.guests.length + ' taster' + (S.guests.length === 1 ? '' : 's') + ' and start a fresh session?')) return;
    newRoom(); return;
  }
  if (t.hasAttribute('data-testlive')) { runLiveTest(); return; }
  if (t.hasAttribute('data-exportbeers')) { exportBeers(); return; }
  if (t.hasAttribute('data-importbeers')) { const f = $('#beersin'); if (f) f.click(); return; }
  if (t.dataset.jump === 'lineup') { location.hash = '#/library'; return; }

  if (t.hasAttribute('data-join')) {
    const v = ($('#nm').value || '').trim().slice(0, 18);
    if (!v) { flash('Pop a name in first', true); return; }
    S.me.name = v; LS.set('me', S.me);
    pushMine(); render(); return;
  }
  if (t.dataset.aroma) {
    const b = beerAt(cue().bi), list = S.mine.aromas[b.id] || (S.mine.aromas[b.id] = []);
    const i = list.indexOf(t.dataset.aroma); i > -1 ? list.splice(i, 1) : list.push(t.dataset.aroma);
    saveMine(); render(); return;
  }
  if (t.dataset.score) { const b = beerAt(cue().bi); S.mine.scores[b.id] = +t.dataset.score; saveMine(); render(); return; }
  if (t.dataset.triv) { S.mine.trivia[t.dataset.triv] = +t.dataset.o; saveMine(); render(); return; }
  if (t.dataset.nose) { S.mine.nose = +t.dataset.nose; saveMine(); render(); return; }
  if (t.hasAttribute('data-email')) {
    const v = ($('#em').value || '').trim().slice(0, 80);
    if (!/^[^@\s]+@[^@\s.]+\.[^@\s]{2,}$/.test(v)) { flash('That email doesn\u2019t look right', true); return; }
    S.mine.email = v; saveMine(); render();
    flash('You\u2019re on the list \u2014 cheers!');
    return;
  }
  if (t.hasAttribute('data-unemail')) { S.mine.email = ''; saveMine(); render(); return; }
  if (t.dataset.target) { pushSession({ target: +t.dataset.target }); return; }
  if (t.hasAttribute('data-copyemails')) { copyEmails(); return; }
  if (t.hasAttribute('data-csvemails')) { csvEmails(); return; }
  if (t.hasAttribute('data-cheers')) {
    S.mine.cheers = (S.mine.cheers || 0) + 1; saveMine(); rain(3);
    if (S.live) { try { S.live.sendCheers(3, S.me.name); } catch (e) {} }
    return;
  }

  if (t.dataset.lineup) {
    e.stopPropagation();
    const id = t.dataset.lineup, ln = (S.session.lineup || []).slice();
    const i = ln.indexOf(id); i > -1 ? ln.splice(i, 1) : ln.push(id);
    const tf = ln.map((_, k) => (S.session.triviaFor || [])[k] != null ? S.session.triviaFor[k] : pickTrivia(k, ln.length));
    await pushSession({ lineup: ln, triviaFor: tf, cue: 0 });
    return;
  }
  if (t.dataset.sel) { S.libSel = t.dataset.sel; render(); return; }
  if (t.hasAttribute('data-newbeer')) {
    const id = 'b' + Date.now().toString(36);
    const b = { id, name: 'New beer', style: 'Pale Ale', abv: 4.5, ibu: 20, colour: '#EFC94B', art: '', hops: '', malt: '', yeast: '', look: '', aroma: '', taste: '', talk: '', food: '', mate: '', fact: '', chips: [], order: S.beers.length };
    await saveBeer(b); S.libSel = id; render(); flash('Beer added'); return;
  }
  if (t.hasAttribute('data-seed')) {
    let n = 0;
    for (const b of CORE_RANGE) if (!S.beers.find(x => x.id === b.id)) { await saveBeer({ ...b, order: n }); n++; }
    render(); flash(n ? n + ' beers loaded' : 'The core range is already in the library'); return;
  }
  if (t.hasAttribute('data-save')) {
    const b = S.beers.find(x => x.id === S.libSel); if (!b) return;
    document.querySelectorAll('[data-f]').forEach(el => {
      const k = el.dataset.f, v = el.value;
      b[k] = (k === 'abv') ? (parseFloat(v) || 0) : (k === 'ibu') ? (v === '' ? null : parseInt(v, 10)) : v;
    });
    await saveBeer(b); render(); flash('Saved');
    return;
  }
  if (t.dataset.del) {
    const id = t.dataset.del;
    S.beers = S.beers.filter(x => x.id !== id); LS.set('beers', S.beers); S.libSel = null;
    const ln = (S.session.lineup || []).filter(x => x !== id);
    await pushSession({ lineup: ln });
    flash('Deleted'); return;
  }
  if (t.dataset.delchip) {
    const b = S.beers.find(x => x.id === S.libSel); if (!b) return;
    b.chips.splice(+t.dataset.delchip, 1); await saveBeer(b); render(); return;
  }
  if (t.hasAttribute('data-clearimg')) {
    const b = S.beers.find(x => x.id === S.libSel); if (!b) return;
    delete b.image; await saveBeer(b); render(); return;
  }
});

function pickTrivia(k, total) { return (k * 3 + 1) % TRIVIA.length; }
function step(d) {
  const list = cues();
  if (d === 0) { newRoom(); return; }
  const n = Math.max(0, Math.min((S.session.cue || 0) + d, list.length - 1));
  const patch = { cue: n };
  /* the clock starts the moment you leave the lobby, not when the page
     was opened -- people join for several minutes before you begin */
  if (!S.session.startedAt && n > 0) patch.startedAt = Date.now();
  pushSession(patch);
}

/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 run clock \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */

const mmss = ms => {
  const t = Math.max(0, Math.round(ms / 1000));
  return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
};

function clockInfo() {
  const list = cues(), idx = Math.min(S.session.cue || 0, list.length - 1);
  const target = (S.session.target || 30) * 60000;
  if (!S.session.startedAt) return { running: false, target, idx, total: list.length };
  const el = Date.now() - S.session.startedAt;
  /* where the clock says you should be, given how far through the running
     order you are. Positive drift = you are running late. */
  const expected = list.length > 1 ? (idx / (list.length - 1)) * target : 0;
  return { running: true, target, el, expected, drift: el - expected, idx, total: list.length };
}

function clockHTML() {
  const c = clockInfo();
  if (!c.running) {
    return `<div class="clk idle"><div class="big">${S.session.target || 30}:00</div>
      <div class="lbl">Clock starts on Next</div>
      <div class="tgt">${[20, 30, 45].map(t => `<button class="${(S.session.target || 30) === t ? 'on' : ''}" data-target="${t}">${t}m</button>`).join('')}</div></div>`;
  }
  const over = c.el > c.target;
  const dmin = Math.round(Math.abs(c.drift) / 60000);
  const state = Math.abs(c.drift) < 60000 ? 'ok' : (c.drift > 0 ? 'late' : 'early');
  const word = state === 'ok' ? 'On time' : (c.drift > 0 ? dmin + ' min behind' : dmin + ' min ahead');
  const tpct = Math.min(100, (c.el / c.target) * 100);
  const ppct = c.total > 1 ? (c.idx / (c.total - 1)) * 100 : 0;
  return `<div class="clk ${state}">
    <div class="big ${over ? 'over' : ''}">${over ? '+' + mmss(c.el - c.target) : mmss(c.target - c.el)}</div>
    <div class="lbl">${over ? 'over the ' + (S.session.target || 30) + ' min' : 'left of ' + (S.session.target || 30) + ' min'} &middot; ${mmss(c.el)} gone</div>
    <div class="pace"><span class="chip">${word}</span></div>
    <div class="dual" title="top: time used. bottom: how far through the running order you are.">
      <div class="t"><i style="width:${tpct}%"></i></div>
      <div class="p"><i style="width:${ppct}%"></i></div>
    </div>
  </div>`;
}

function miniClockHTML() {
  const c = clockInfo();
  if (!c.running) return `<span class="t">${S.session.target || 30}:00</span><span class="chip idle">Not started</span>`;
  const over = c.el > c.target;
  const dmin = Math.round(Math.abs(c.drift) / 60000);
  const state = Math.abs(c.drift) < 60000 ? 'ok' : (c.drift > 0 ? 'late' : 'early');
  const word = state === 'ok' ? 'On time' : (c.drift > 0 ? dmin + 'm behind' : dmin + 'm ahead');
  return `<span class="t ${over ? 'over' : ''}">${over ? '+' + mmss(c.el - c.target) : mmss(c.target - c.el)}</span><span class="chip ${state}">${word}</span>`;
}

let clockT;
function startClock() {
  clearInterval(clockT);
  const paint = () => {
    const el = document.getElementById('deskclock');
    if (!el) { clearInterval(clockT); return; }
    el.innerHTML = clockHTML();
    const mini = document.getElementById('deskclock2');
    if (mini) mini.innerHTML = miniClockHTML();
  };
  paint();
  clockT = setInterval(paint, 1000);
}

document.addEventListener('keydown', e => {
  if (S.role !== 'screen' && S.role !== 'desk') return;
  if (e.target.matches('input,textarea')) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); step(1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
});
